# nginx for the ZettaPlanner container.
#
# One server block, one origin. The SPA and the API share it, which is the
# whole reason there is no CORS in a deployment (D2): the browser never learns
# that two processes are involved, and the session cookie behaves in production
# exactly as the Vite proxy makes it behave in development.
#
# It listens on 127.0.0.1 only. The container runs with host networking so the
# backend can reach the Ollama daemon the model registry points at, and a
# loopback bind is what keeps that from also putting the product on the LAN.
# The Cloudflare tunnel runs on the same host and dials this address; nothing
# else can.

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format zp '$remote_addr "$host" "$request" $status $body_bytes_sent '
                '"$http_referer" "$http_user_agent" $request_time';
  access_log /dev/stdout zp;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;

  # An ingest accepts 64 MiB (ingest.MaxUploadBytes). nginx defaults to 1 MiB,
  # which would reject a photographed notebook with a 413 the product never
  # sees and therefore cannot explain.
  client_max_body_size 64m;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_proxied      any;
  gzip_types        text/plain text/css application/javascript application/json
                    image/svg+xml application/wasm;

  # The tunnel terminates TLS and forwards plain http, so $scheme is always
  # "http" here. X-Forwarded-Proto from cloudflared is the real answer; fall
  # back to $scheme when nothing is in front (local access on :8091).
  #
  # This is what makes ZP_SECURE_COOKIES honest: the backend reads the header
  # to decide the cookie is being set over TLS, and only nginx may set it.
  map $http_x_forwarded_proto $forwarded_proto {
    default   $scheme;
    "~^.+$"   $http_x_forwarded_proto;
  }

  upstream zettaplanner_api {
    server 127.0.0.1:8095;
    keepalive 16;
  }

  server {
    listen 127.0.0.1:8091 default_server;
    server_name zettaplanner.felodynn.com localhost _;
    root /srv/web;

    # Quiet defaults. No CSP: the index inlines the pre-paint theme script, so
    # a useful policy needs a nonce per response, which is a build change
    # rather than a line here.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # A planning substrate is not something to find in a search index.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # nginx answering, so the healthcheck can tell "the container is up" from
    # "the API is up". /health below is the second half of that question.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # --- the live stream ----------------------------------------------------
    # A regex location, so it wins over the /api/ prefix below. Buffering has to
    # be off or nginx holds each event until its buffer fills, and a turn's
    # progress arrives in one burst at the end — which is indistinguishable
    # from the stall the thread's reconnect logic exists to survive.
    #
    # The read timeout outlasts the longest turn: the planner model is
    # configured with a 15m timeout, and a stream cut at 60s would drop every
    # client mid-turn and make them all reconnect at once.
    location ~ ^/api/v1/projects/[^/]+/events$ {
      proxy_pass http://zettaplanner_api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Connection        "";

      proxy_buffering    off;
      proxy_cache        off;
      proxy_read_timeout 3600s;
      chunked_transfer_encoding on;
      # Belt and braces for any other buffering proxy in the path.
      add_header X-Accel-Buffering no always;
    }

    # --- the API ------------------------------------------------------------
    # 15m matches the planner model's own timeout: a turn that the backend is
    # still legitimately working on must not be cut off by the thing in front
    # of it, or the client sees a 504 for a turn that then completes anyway.
    location /api/ {
      proxy_pass http://zettaplanner_api;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_set_header Connection        "";
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
      proxy_request_buffering off;
    }

    # The backend's own liveness answer, and the OpenAPI document and its
    # rendered docs. All three live outside /api, so without this they would
    # fall through to the SPA and return index.html with a 200 — a health check
    # that passes while the API is dead.
    location = /health   { proxy_pass http://zettaplanner_api; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://zettaplanner_api; proxy_set_header Host $host; }
    location = /openapi.yaml { proxy_pass http://zettaplanner_api; proxy_set_header Host $host; }
    location = /docs     { proxy_pass http://zettaplanner_api; proxy_set_header Host $host; }

    # --- static -------------------------------------------------------------
    # Vite fingerprints everything under /assets, so those are immutable.
    location /assets/ {
      # One Cache-Control, written once. `expires 1y` would emit a second one
      # saying only max-age, and two of them is a question rather than a rule.
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      access_log off;
      try_files $uri =404;
    }

    # index.html is the one file that must never be cached: it names the
    # current asset hashes, and a stale copy points at bundles that are gone.
    location = /index.html {
      add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Client-side routing: every unknown path is a route, not a 404.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
