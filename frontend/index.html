<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ZettaPlanner</title>
    <script>
      // Pre-paint theme. Runs before the stylesheet resolves and before React
      // mounts, so an OLED user never gets a white flash on load.
      //
      // Mirrors applyTheme() in src/theme/theme.ts. Both write the same two
      // attributes; if they ever disagree the page flashes, which is why the
      // logic is this short and lives in exactly these two places.
      ;(function () {
        try {
          var mode = localStorage.getItem('zp.appearance.mode') || 'system'
          var accent = localStorage.getItem('zp.appearance.accent') || 'gold'
          var dark =
            mode === 'dark' ||
            (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.setAttribute('data-theme', dark ? 'dark' : 'light')
          root.setAttribute('data-accent', accent)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
          document.documentElement.setAttribute('data-accent', 'gold')
        }
      })()
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
